name: Chartink Hourly Alert

on:
  schedule:
    # Runs at the top of every hour. Cron is in UTC.
    # Indian market hours (9:15 AM – 3:30 PM IST) = 3:45 AM – 10:00 AM UTC.
    # The script also has a built-in market-hours check, so any stray runs are skipped.
    - cron: '*/15 3-10 * * 1-5'
  workflow_dispatch:   # lets you also run it manually with one click

jobs:
  send-alert:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run alert script
        env:
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL:    ${{ secrets.RECIPIENT_EMAIL }}
          MARKET_HOURS_ONLY:  'true'
        run: python chartink_alert.py
